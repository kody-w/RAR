name: Critic Panel

on:
  push:
    branches: [main]
    paths:
      - 'agents/**'        # a publish: the code changed, so the verdict must be re-earned
      - 'state/votes.json' # a vote: the audience meter moved
  workflow_dispatch:
    inputs:
      agent:
        description: 'Review one agent (@publisher/slug). Blank = whatever needs it.'
        required: false
      limit:
        description: 'Max agents this run'
        required: false
        default: '12'
      force:
        description: 'Re-review even when nothing changed'
        type: boolean
        default: false
  schedule:
    - cron: '40 4 * * *'  # daily backfill so coverage keeps growing

permissions:
  contents: write
  models: read            # GitHub Models inference for the critic panel

concurrency:
  group: critic-panel
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run the critic panel (source review only)
        # DELIBERATELY --no-run --no-chat. Executing a contributor's agent here
        # would run arbitrary third-party Python next to a write-scoped
        # GITHUB_TOKEN that actions/checkout leaves in .git/config. Verdicts
        # backed by real execution are produced by a maintainer running
        # `python scripts/critic_review.py` locally, where the blast radius is
        # a laptop rather than a token with push access to this repository.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RAR_CRITIC_BACKEND: models
          INPUT_AGENT: ${{ github.event.inputs.agent }}
          INPUT_LIMIT: ${{ github.event.inputs.limit || '12' }}
          INPUT_FORCE: ${{ github.event.inputs.force }}
        run: |
          set -euo pipefail
          ARGS=(--no-run --no-chat --limit "${INPUT_LIMIT}")
          if [ -n "${INPUT_AGENT}" ]; then ARGS+=(--agent "${INPUT_AGENT}"); fi
          if [ "${INPUT_FORCE}" = "true" ]; then ARGS+=(--force); fi
          python scripts/critic_review.py "${ARGS[@]}"

      - name: Fold scores into the metrics snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/build_metrics.py

      - name: Commit verdicts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/critic_reviews.json state/critic_transcripts state/metrics.json state/metrics_history.json
          if git diff --staged --quiet; then
            echo "No verdict changes"
          else
            git commit -m "chore: critic panel verdicts $(date -u +%Y-%m-%dT%H:%M)"
            # Rebase normally. --strategy-option=ours would silently drop whatever
            # landed on main in the meantime, including this job's own work.
            for attempt in 1 2 3; do
              git pull --rebase origin main && git push && exit 0
              sleep 5
            done
            echo "could not land the verdicts on main" >&2
            exit 1
          fi
