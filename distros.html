<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Distros — RAR</title>
<!-- Every RAR stack (distro) with a QR code beside it. Scan with a phone paired to your
     Brainstem (over Tailscale) to summon it; or say its 7-word chant on s.html.
     The QR encodes https://kody-w.github.io/RAR/s.html#<seed> and is drawn in the browser;
     the link is never sent to a QR service. Unverified stacks get no QR.
     "Rip it open" tears the pack and deals its parts as cards, read from the pack's own
     stacks/<name>/pack.json (a thin view over the same JSON). Trading-card-game lessons: the
     reveal is one click to skip, never gates the summon link, and is instant under
     prefers-reduced-motion. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"
        integrity="sha384-mZT2gIty7ZDdOGkxfP6joZcYdMW1Jvj9dRlfpTmaJAKKXTqzygtB22k7FLe+KZC1"
        crossorigin="anonymous"></script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
         background: #0d1117; color: #e6edf3; margin: 0; padding: 28px 16px; }
  main { max-width: 860px; margin: 0 auto; }
  h1 { margin: 0 0 4px; } .sub { color: #8b949e; margin: 0 0 24px; }
  .row { display: flex; gap: 20px; align-items: center; background: #161b22; border: 1px solid #30363d;
         border-radius: 16px; padding: 20px; margin-bottom: 14px; flex-wrap: wrap; }
  .info { flex: 1; min-width: 0; }
  .info h2 { margin: 0 0 6px; font-size: 20px; }
  .info p { margin: 6px 0; line-height: 1.45; color: #c9d1d9; }
  .chant { font-size: 13px; color: #8b949e; letter-spacing: .02em; }
  .chant b { color: #e6edf3; }
  .qr { width: 156px; height: 156px; background: #fff; border-radius: 10px; padding: 8px; flex: none;
        display: flex; align-items: center; justify-content: center; }
  .qr img { width: 140px; height: 140px; image-rendering: pixelated; }
  .off { width: 156px; flex: none; text-align: center; color: #f0883e; font-size: 14px; }
  a { color: #58a6ff; }
  button.rip { margin-top: 10px; background: linear-gradient(135deg, #58a6ff, #bc8cff); color: #fff; border: 0;
               border-radius: 999px; padding: 9px 18px; font-size: 14px; font-weight: 700; cursor: pointer;
               box-shadow: 0 6px 20px rgba(88,166,255,.25); }
  button.rip:hover { filter: brightness(1.08); }
  button.rip[disabled] { opacity: .5; cursor: default; }
  /* ---- the pack ---- */
  .table { flex-basis: 100%; display: none; }
  .table.open { display: block; }
  .stage { position: relative; min-height: 250px; display: flex; align-items: center; justify-content: center; }
  .pack { position: relative; width: 200px; height: 250px; border-radius: 14px;
          background: linear-gradient(160deg, #1f6feb 0%, #8957e5 45%, #f778ba 100%);
          box-shadow: 0 20px 50px rgba(0,0,0,.55), inset 0 0 0 2px rgba(255,255,255,.18);
          display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
          padding: 16px; color: #fff; overflow: hidden; }
  .pack::before { content: ""; position: absolute; inset: 0;
          background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.45) 50%, transparent 70%);
          transform: translateX(-120%); animation: foil 2.2s ease-in-out infinite; }
  @keyframes foil { to { transform: translateX(120%); } }
  .pack .name { font-size: 20px; font-weight: 800; line-height: 1.15; text-shadow: 0 2px 6px rgba(0,0,0,.4); }
  .pack .count { margin-top: 10px; font-size: 13px; opacity: .9; }
  .pack .tear { position: absolute; top: 0; left: 0; right: 0; height: 44px;
          background: linear-gradient(160deg, #1f6feb, #8957e5); border-bottom: 2px dashed rgba(255,255,255,.6);
          transform-origin: left top; }
  .pack.ripping .tear { animation: tear .55s cubic-bezier(.3,1.4,.6,1) forwards; }
  @keyframes tear { 40% { transform: rotate(-8deg) translate(-6px, -4px); }
                    100% { transform: rotate(-70deg) translate(-150px, -40px); opacity: 0; } }
  .pack.ripping { animation: shake .55s ease-in-out; }
  @keyframes shake { 25% { transform: rotate(-2deg); } 50% { transform: rotate(2.5deg); } 75% { transform: rotate(-1.5deg); } }
  .pack.gone { animation: drop .5s ease-in forwards; }
  @keyframes drop { to { transform: translateY(120px) scale(.8); opacity: 0; } }
  .hand { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
  .card { width: 168px; min-height: 230px; border-radius: 12px; background: #0d1117; border: 1px solid #30363d;
          padding: 12px; display: flex; flex-direction: column; gap: 6px; transform-style: preserve-3d;
          animation: deal .6s cubic-bezier(.2,.9,.3,1.1) both; position: relative; }
  .card::before { content: ""; position: absolute; inset: -1px; border-radius: 12px; padding: 1px;
          background: linear-gradient(135deg, #58a6ff, #bc8cff); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
          -webkit-mask-composite: xor; mask-composite: exclude; opacity: .7; }
  @keyframes deal { from { transform: translateY(-140px) rotateY(180deg) scale(.6); opacity: 0; }
                    60% { opacity: 1; } to { transform: none; opacity: 1; } }
  .card .kind { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #8b949e; }
  .card .title { font-weight: 700; font-size: 14px; word-break: break-word; }
  .card .what { font-size: 12.5px; color: #c9d1d9; line-height: 1.35; flex: 1; }
  .card .sha { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; color: #8b949e; }
  .card .ok { color: #3fb950; font-size: 12px; }
  .card.rare { background: radial-gradient(120% 120% at 20% 0%, #2d1f5e, #0d1117 60%); }
  .card.rare::before { background: linear-gradient(135deg, #f778ba, #ffd33d, #58a6ff); opacity: 1; }
  .card.summon { background: linear-gradient(160deg, #0f2a4a, #0d1117); align-items: flex-start; }
  .card.summon a.go { display: inline-block; margin-top: 4px; background: #238636; color: #fff; border-radius: 8px;
          padding: 7px 12px; font-weight: 700; text-decoration: none; font-size: 13px; }
  .bar { display: flex; gap: 10px; align-items: center; justify-content: center; margin-top: 12px; color: #8b949e; font-size: 13px; }
  .bar button { background: transparent; color: #8b949e; border: 1px solid #30363d; border-radius: 8px; padding: 5px 10px; cursor: pointer; }
  .bar button:hover { color: #e6edf3; border-color: #484f58; }
  @media (prefers-reduced-motion: reduce) {
    .pack::before, .pack.ripping, .pack.ripping .tear, .pack.gone, .card { animation: none !important; }
  }
  @media (max-width: 560px) { .row { flex-direction: column; align-items: flex-start; } }
</style>
</head>
<body>
<main>
  <h1>Distros</h1>
  <p class="sub">Scan a code with your phone to summon that distro into your own Brainstem, or say its chant at
    <a href="s.html">s.html</a>. First time? Install the <b>Summon</b> distro and pair your phone.
    Curious what is inside a pack? <b>Rip it open.</b></p>
  <div id="list">Loading…</div>
</main>
<script>
(function () {
  "use strict";
  var PAGE = "https://kody-w.github.io/RAR/s.html#";
  var REDUCED = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function esc(s) { var d = document.createElement("div"); d.textContent = String(s == null ? "" : s); return d.innerHTML; }
  // 64-bit seeds lose precision as JS numbers: quote them before parsing.
  function parseExact(t) { return JSON.parse(t.replace(/("_seed"\s*:\s*)(\d+)/g, '$1"$2"')); }
  function qrImg(link) {
    if (typeof qrcode !== "function") return null;
    var q = qrcode(0, "M"); q.addData(link); q.make();
    return q.createImgTag(4, 0);
  }
  function wait(ms) { return new Promise(function (res) { setTimeout(res, REDUCED ? 0 : ms); }); }

  // The cards a pack holds: parts (publisher-scoped, 1.2+) first, then every other file, then the summon card.
  function cardsFor(p, pack) {
    var cards = [], seen = {};
    var parts = (pack && pack.install && pack.install.parts) || [];
    parts.forEach(function (x) {
      seen[x.file] = true;
      cards.push({ kind: (x.kind || "part") + (x.point ? " · " + x.point : ""), title: x.id || x.file,
                   what: x.what || "", sha: x.sha256, rare: x.kind === "kernel",
                   ok: !!(p.files && p.files[x.file] && p.files[x.file].verified) });
    });
    Object.keys((pack && pack.files) || p.files || {}).forEach(function (f) {
      if (seen[f]) return;
      var rec = (p.files && p.files[f]) || {};
      cards.push({ kind: /\.py$/.test(f) ? "agent file" : /readme/i.test(f) ? "notes" : "file", title: f,
                   what: "", sha: rec.sha256 || ((pack.files || {})[f] || {}).sha256, ok: rec.verified === true });
    });
    return cards;
  }
  function cardEl(c, i) {
    var el = document.createElement("div");
    el.className = "card" + (c.rare ? " rare" : "");
    el.style.animationDelay = (REDUCED ? 0 : i * 0.22) + "s";
    el.innerHTML = "<div class='kind'>" + esc(c.kind) + "</div><div class='title'>" + esc(c.title) + "</div>" +
      "<div class='what'>" + esc(c.what) + "</div>" +
      (c.sha ? "<div class='sha' title='" + esc(c.sha) + "'>sha256 " + esc(String(c.sha).slice(0, 12)) + "…</div>" : "") +
      (c.ok ? "<div class='ok'>✓ bytes match the pack</div>" : "");
    return el;
  }
  function summonEl(p, pack, link, i) {
    var el = document.createElement("div"); el.className = "card summon";
    el.style.animationDelay = (REDUCED ? 0 : i * 0.22) + "s";
    var one = pack && pack.install && pack.install.one_liner;
    el.innerHTML = "<div class='kind'>summon</div><div class='title'>" + esc(p.display_name) + " " + esc(p.version || "") + "</div>" +
      (p._incantation ? "<div class='what'>Chant: <b>" + esc(p._incantation) + "</b></div>" : "") +
      (one ? "<div class='sha' title='" + esc(one) + "'>" + esc(one) + "</div>" : "") +
      (link ? "<a class='go' href='" + esc(link) + "'>Summon it</a>" : "<div class='what'>Not verified yet, so it can't be summoned.</div>");
    return el;
  }

  function rip(p, row, btn, link) {
    var table = row.querySelector(".table");
    if (table.classList.contains("open")) { table.classList.remove("open"); btn.textContent = "Rip it open"; return; }
    btn.textContent = "Close"; table.classList.add("open");
    table.innerHTML = "<div class='stage'><div class='pack'><div class='tear'></div><div class='name'>" + esc(p.display_name) +
      "</div><div class='count'>" + Object.keys(p.files || {}).length + " things inside</div></div></div>" +
      "<div class='bar'><button type='button' class='skip'>Skip the reveal</button></div>";
    var stage = table.querySelector(".stage"), pack = stage.querySelector(".pack");
    var skipped = false;
    table.querySelector(".skip").onclick = function () { skipped = true; };
    fetch(p.path + "/pack.json", { cache: "no-cache" }).then(function (r) { return r.ok ? r.text().then(parseExact) : null; })
      .catch(function () { return null; }).then(function (pj) {
        var cards = cardsFor(p, pj);
        return wait(250).then(function () { pack.classList.add("ripping"); return wait(skipped ? 0 : 600); })
          .then(function () { pack.classList.add("gone"); return wait(skipped ? 0 : 450); })
          .then(function () {
            stage.innerHTML = ""; var hand = document.createElement("div"); hand.className = "hand"; stage.appendChild(hand);
            if (skipped || REDUCED) hand.style.setProperty("--instant", "1");
            cards.forEach(function (c, i) { var el = cardEl(c, skipped ? 0 : i); hand.appendChild(el); });
            hand.appendChild(summonEl(p, pj, link, skipped ? 0 : cards.length));
            table.querySelector(".bar").innerHTML = "<span>" + cards.length + " part" + (cards.length === 1 ? "" : "s") +
              " dealt from " + esc(p.path) + "/pack.json</span>";
          });
      });
  }

  fetch("registry.json", { cache: "no-cache" }).then(function (r) { return r.text(); }).then(parseExact).then(function (reg) {
    var packs = (reg.stack_packs || []).slice().sort(function (a, b) {
      return (b._verified === true) - (a._verified === true) || String(a.display_name).localeCompare(b.display_name);
    });
    var list = document.getElementById("list");
    if (!packs.length) { list.textContent = "No distros yet."; return; }
    list.innerHTML = "";
    packs.forEach(function (p) {
      var row = document.createElement("div"); row.className = "row";
      var ok = p._verified === true && p._seed;
      var link = ok ? PAGE + p._seed : null;
      row.innerHTML = "<div class='info'><h2>" + esc(p.display_name) + "</h2><p>" + esc(p.purpose) + "</p>" +
        (p._incantation ? "<div class='chant'>Chant: <b>" + esc(p._incantation) + "</b></div>" : "") +
        (ok ? "<p><a href='" + esc(link) + "'>Open summon page</a></p>" : "") +
        "<button type='button' class='rip'>Rip it open</button></div>";
      var side = document.createElement("div");
      if (ok) {
        side.className = "qr"; side.title = link;
        side.innerHTML = qrImg(link) || "<a href='" + esc(link) + "'>Open</a>";
      } else {
        side.className = "off"; side.textContent = "Not verified yet, so it can't be summoned.";
      }
      row.appendChild(side);
      var table = document.createElement("div"); table.className = "table"; row.appendChild(table);
      var btn = row.querySelector(".rip");
      btn.onclick = function () { rip(p, row, btn, link); };
      list.appendChild(row);
    });
  }).catch(function () { document.getElementById("list").textContent = "Couldn't load the registry."; });
})();
</script>
</body>
</html>
