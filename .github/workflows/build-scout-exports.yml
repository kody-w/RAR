name: Build Microsoft Scout Exports

on:
  pull_request:
    paths:
      - "agents/**"
      - "swarms/**"
      - "registry.json"
      - "state/federation.json"
      - "state/aggregated.json"
      - "state/agent_lifecycle.json"
      - "state/scout_skill_identities.json"
      - "rapp_skill_agent.py"
      - "scout.config.json"
      - "scripts/build_scout_exports.py"
      - "scripts/rapp_agent_converter_agent.py"
      - "scripts/scout_run_agent.py"
      - "tests/test_rapp_agent_converter.py"
      - "tests/test_scout_rapp_skill.py"
      - ".claude-plugin/marketplace.json"
      - ".github/workflows/build-scout-exports.yml"
  push:
    branches: [main]
    paths:
      - "agents/**"
      - "swarms/**"
      - "registry.json"
      - "state/federation.json"
      - "state/aggregated.json"
      - "state/agent_lifecycle.json"
      - "state/scout_skill_identities.json"
      - "rapp_skill_agent.py"
      - "scout.config.json"
      - "scripts/build_scout_exports.py"
      - "scripts/rapp_agent_converter_agent.py"
      - "scripts/scout_run_agent.py"
      - "tests/test_rapp_agent_converter.py"
      - ".claude-plugin/marketplace.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scout-export-main
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Build deterministic Scout projection
        run: |
          python scripts/build_scout_exports.py
          python scripts/build_pokedex_api.py
          python scripts/build_static_api.py
          python scripts/build_front_page.py

      - name: Test Scout import surface
        run: >-
          pytest -q
          tests/test_scout_rapp_skill.py
          tests/test_rapp_agent_converter.py
          tests/test_skill_first_surfaces.py

      - name: Require committed output on pull requests
        if: github.event_name == 'pull_request'
        run: |
          git add -A -- rapp_skill.md rapp_skills.md scout/ state/scout_skill_identities.json api/v1/ manifest.json
          git diff --cached --exit-code

  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Rebuild after compatibility matrix
        run: |
          python scripts/build_scout_exports.py
          python scripts/build_pokedex_api.py
          python scripts/build_static_api.py
          python scripts/build_front_page.py

      - name: Publish changed projection
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "${{ github.sha }}" ]; then
            echo "main advanced after the validated matrix; newer workflow owns publication"
            exit 0
          fi
          git config user.name "RAPP Scout Export Bot"
          git config user.email "rapp-bot@users.noreply.github.com"
          git add rapp_skill.md rapp_skills.md scout/ state/scout_skill_identities.json api/v1/ manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Build Scout skills and workflows [skip ci]"
            git push origin HEAD:main
          fi
