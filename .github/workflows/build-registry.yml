name: Build Agent Registry

on:
  push:
    paths:
      - 'agents/**/*.py'
      - 'agents/**/*.py.card'
      - 'build_registry.py'
      - 'rar.config.json'
      - '.github/workflows/build-registry.yml'
  pull_request:
    paths:
      - 'agents/**/*.py'
      - 'agents/**/*.py.card'
  workflow_dispatch:

permissions:
  contents: write
  discussions: write # provision the new agent's signal surface at add time

jobs:
  build-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify changed agent receipts
        if: github.event_name == 'push'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/check_notarized_changes.py --base "$BASE_SHA"
      
      - name: Reject kebab-case agent filenames
        run: |
          BAD=$(find agents -name '*-*' -name '*.py' ! -path '*/.*' || true)
          if [ -n "$BAD" ]; then
            echo "❌ Agent filenames must be snake_case (no dashes):"
            echo "$BAD"
            exit 1
          fi

      - name: Security scan agents
        run: python security_scan.py

      - name: Build registry
        run: python build_registry.py

      - name: Commit registry.json
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "RAPP Registry Bot"
          git config user.email "rapp-bot@users.noreply.github.com"
          git add registry.json
          git diff --cached --quiet || git commit -m "Auto-build registry.json [skip ci]"
          git push

      # An agent's signal surface is provisioned the moment it enters the
      # registry — its Discussion thread plus every marker comment in
      # MARKERS — instead of waiting up to 24h for the nightly refresh.
      # Both commands are idempotent and capped, so re-running is free and a
      # large import drains over subsequent runs rather than tripping
      # GitHub's content-creation limits. Non-fatal: a registry build must
      # never fail because a comment could not be posted.
      - name: Provision signal surface for new agents
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/discussion_ratings.py seed --limit 25
          python scripts/discussion_ratings.py tally --limit 25
