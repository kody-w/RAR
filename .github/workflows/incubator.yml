name: incubator
on:
  push:
    paths: ["incubator/**", ".github/workflows/incubator.yml"]
  pull_request:
    paths: ["incubator/**", ".github/workflows/incubator.yml"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: python3 incubator/build_incubator.py --check
