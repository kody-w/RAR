name: Feature Request
description: Suggest an improvement to RAR, its marketplace, or integrations
title: "[FEATURE] "
labels: ["enhancement"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Agent registry or SDK
        - Scout / Copilot plugin marketplace
        - Brainstem or MCP interoperability
        - Cowork / aggregated sources
        - Store or static API
        - Governance / contribution workflow
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What user outcome is blocked today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the behavior and permission boundary you want.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: proof
    attributes:
      label: Reproduction or reference implementation
      description: Link a public proof, protocol, fixture, or comparable pattern.
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am willing to help test or contribute this feature.
