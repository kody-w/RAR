name: Build Agent Registry

on:
  push:
    paths:
      - 'agents/**/*.py'
      - 'agents/**/*.py.card'
      - 'build_registry.py'
      - 'rar.config.json'
      - '.github/workflows/build-registry.yml'
  pull_request:
    paths:
      - 'agents/**/*.py'
      - 'agents/**/*.py.card'
  workflow_dispatch:

permissions:
  contents: write
  discussions: write # provision the new agent's signal surface at add time

jobs:
  build-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify changed agent receipts
        if: github.event_name == 'push'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/check_notarized_changes.py --base "$BASE_SHA"
      
      - name: Reject kebab-case agent filenames
        run: |
          BAD=$(find agents -name '*-*' -name '*.py' ! -path '*/.*' || true)
          if [ -n "$BAD" ]; then
            echo "❌ Agent filenames must be snake_case (no dashes):"
            echo "$BAD"
            exit 1
          fi

      - name: Security scan agents
        run: python security_scan.py

      - name: Build registry
        run: python build_registry.py

      # Article XXIII — record newly published agents into the permanent
      # URL ledger the moment they land on main. From this point the path
      # is frozen: check_url_stability.py will fail any later PR that
      # renames, moves, or deletes it. Append-only by construction.
      - name: Record new agents in the permanent URL ledger
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python scripts/check_url_stability.py --update

      # The headless API is what AIdeate, the vBrainstem and the grail
      # brainstem actually read. A stale catalog is an invisible failure —
      # host applications keep serving yesterday's registry with no error —
      # so it is rebuilt in the same step that rebuilds the registry.
      # Additive by construction: it refuses to write api/v1/index.json.
      - name: Rebuild the headless static API
        run: python scripts/build_static_api.py

      - name: Commit registry.json
        # Also commits on workflow_dispatch. A dispatch run used to rebuild the
        # API and then throw it away, so the one button a maintainer reaches for
        # when the catalog looks stale could not actually fix it.
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          git config user.name "RAPP Registry Bot"
          git config user.email "rapp-bot@users.noreply.github.com"
          git add registry.json state/published_paths.json \
                  manifest.json api/v1/catalog.json api/v1/taxonomy.json \
                  api/v1/match.json api/v1/status.json api/v1/badge.json \
                  api/v1/audience
          git diff --cached --quiet || git commit -m "Auto-build registry.json [skip ci]"
          git push

      # An agent's signal surface is provisioned the moment it enters the
      # registry — its Discussion thread plus every marker comment in
      # MARKERS — instead of waiting up to 24h for the nightly refresh.
      # Both commands are idempotent and capped, so re-running is free and a
      # large import drains over subsequent runs rather than tripping
      # GitHub's content-creation limits. Non-fatal: a registry build must
      # never fail because a comment could not be posted.
      - name: Provision signal surface for new agents
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/discussion_ratings.py seed --limit 25
          python scripts/discussion_ratings.py tally --limit 25
