name: Seasonal Release

on:
  workflow_dispatch:
    inputs:
      release_name:
        description: 'Release name (e.g., "Genesis", "Spring 2026")'
        required: true
      release_type:
        description: 'Release type'
        required: true
        default: 'seasonal'
        type: choice
        options:
          - seasonal
          - hotfix
          - canary
      dry_run:
        description: 'Dry run (validate only, no tag/release)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # ─── GATE: full test suite must pass ────────────────────────────
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test deps
        run: pip install pytest pyyaml

      - name: Full test suite
        run: pytest -v --tb=short

      - name: Build registry
        run: python build_registry.py

      - name: Security scan
        run: |
          python -c "
          import re, sys
          from pathlib import Path
          sys.path.insert(0, '.')
          from build_registry import SECURITY_ALLOWLIST, DANGEROUS_PATTERNS
          fails = []
          for f in Path('agents').rglob('*.py'):
              if str(f) in SECURITY_ALLOWLIST: continue
              src = f.read_text()
              for pat, msg in DANGEROUS_PATTERNS:
                  if re.search(pat, src):
                      fails.append(f'{f}: {msg}')
          if fails:
              for f in fails: print(f)
              sys.exit(1)
          print('Security scan passed')
          "

      - name: Integrity audit
        run: |
          python -c "
          import hashlib, json, sys
          from pathlib import Path
          reg = json.loads(Path('registry.json').read_text())
          for a in reg['agents']:
              f = Path(a['_file'])
              if not f.exists(): continue
              actual = hashlib.sha256(f.read_bytes()).hexdigest()
              # Gated agents ship as .py.stub and record _stub_sha256; the
              # builder never writes _sha256 for them. Verify each against the
              # digest its own kind records rather than skipping stubs — the
              # release notes claim SHA256 verification for everything, so
              # everything on disk has to actually be verified.
              expected = a.get('_sha256') or a.get('_stub_sha256')
              assert expected and expected == actual, f'{a[\"name\"]} hash mismatch'
          print(f'All {len(reg[\"agents\"])} agents verified')
          "

      - name: No staging leftovers
        run: |
          # Pending submissions land in staging/@publisher/. staging/demo-assets/
          # is permanent demo material — the n8n->RAPP transpilation showcase,
          # documented in its own README — so it is not a submission and no
          # approve/reject could ever clear it. Excluding it keeps this gate
          # meaningful instead of permanently red for a reason nobody can act on.
          STAGED=$(find staging -name '*.py' -not -path 'staging/demo-assets/*' 2>/dev/null | head -5)
          if [ -n "$STAGED" ]; then
            echo "❌ Agents still in staging/ — approve or reject before release:"
            echo "$STAGED"
            exit 1
          fi
          echo "✓ Staging is clean"

  # ─── RELEASE: tag, generate notes, publish ──────────────────────
  release:
    runs-on: ubuntu-latest
    needs: validate
    if: ${{ !inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate release metadata
        id: meta
        # release_name is operator-supplied free text. It reaches Python through
        # the environment, never through ${{ }} interpolation into the source —
        # a name containing a quote would otherwise break the script, and a
        # crafted one would execute on the runner.
        env:
          RELEASE_NAME: ${{ inputs.release_name }}
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          python -c "
          import json, hashlib, os
          from pathlib import Path
          from datetime import datetime, timezone

          reg = json.loads(Path('registry.json').read_text())
          agents = reg['agents']
          now = datetime.now(timezone.utc)

          # Integrity seal over every agent's digest. Gated agents record
          # _stub_sha256 rather than _sha256; falling back to '' for them would
          # seal a constant and silently exclude them from the seal.
          hashes = sorted((a.get('_sha256') or a.get('_stub_sha256') or '') for a in agents)
          seal = hashlib.sha256('|'.join(hashes).encode()).hexdigest()[:16]

          meta = {
              'release_name': os.environ['RELEASE_NAME'],
              'release_type': os.environ['RELEASE_TYPE'],
              'timestamp': now.isoformat(),
              'agent_count': len(agents),
              'publishers': reg['stats']['publishers'],
              'integrity_seal': seal,
          }
          Path('/tmp/release_meta.json').write_text(json.dumps(meta, indent=2))
          print('Release: ' + os.environ['RELEASE_NAME'])
          print(f'Agents: {len(agents)}')
          print(f'Seal: {seal}')
          "

      - name: Stamp release into registry
        run: |
          python -c "
          import json
          from pathlib import Path

          meta = json.loads(Path('/tmp/release_meta.json').read_text())
          reg = json.loads(Path('registry.json').read_text())

          # Add release stamp
          if 'releases' not in reg:
              reg['releases'] = []
          reg['releases'].append(meta)
          reg['latest_release'] = meta

          Path('registry.json').write_text(json.dumps(reg, indent=2))
          print(f'Stamped release: {meta[\"release_name\"]}')
          "

      - name: Compute version tag
        id: tag
        run: |
          # Count existing releases to auto-increment
          EXISTING=$(git tag -l 'v*' | wc -l | tr -d ' ')
          NEXT=$((EXISTING + 1))
          TYPE="${{ inputs.release_type }}"
          if [ "$TYPE" = "canary" ]; then
            TAG="v${NEXT}.0.0-canary.$(date +%Y%m%d)"
          elif [ "$TYPE" = "hotfix" ]; then
            TAG="v${NEXT}.0.1"
          else
            TAG="v${NEXT}.0.0"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Tag: $TAG"

      - name: Commit release stamp
        run: |
          git config user.name "RAPP Registry Bot"
          git config user.email "rapp-bot@users.noreply.github.com"
          git add registry.json
          git diff --cached --quiet || git commit -m "Release ${{ inputs.release_name }} (${{ steps.tag.outputs.tag }}) [skip ci]"
          git push

      # Every agent ships as a flat release asset. This is the ONLY download
      # path GitHub counts for us: a public release asset needs no token to
      # fetch, and GitHub increments download_count server-side on every
      # fetch, anonymous ones included — the same property that makes npm's
      # public download numbers real. raw.githubusercontent.com fetches are
      # invisible to us by comparison, which is why the reaction-based tally
      # reads ~0. Reactions stay for upvotes; assets carry downloads.
      - name: Stage release assets
        run: python scripts/stage_release_assets.py

      - name: Create GitHub release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const meta = JSON.parse(fs.readFileSync('/tmp/release_meta.json', 'utf8'));
            const tag = '${{ steps.tag.outputs.tag }}';

            // Create tag
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/${tag}`,
              sha: context.sha
            });

            // Create release
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `${{ inputs.release_name }} (${tag})`,
              body: [
                `## ${{ inputs.release_name }}`,
                ``,
                `| Metric | Value |`,
                `|--------|-------|`,
                `| Agents | ${meta.agent_count} |`,
                `| Publishers | ${meta.publishers} |`,
                `| Type | ${meta.release_type} |`,
                `| Integrity Seal | \`${meta.integrity_seal}\` |`,
                `| Timestamp | ${meta.timestamp} |`,
                ``,
                `### What's in this release`,
                `Every agent in this release has passed:`,
                `- Contract tests (manifest, class structure, perform())`,
                `- Security scan (no eval/exec/subprocess/hardcoded secrets)`,
                `- SHA256 integrity verification`,
                `- Version immutability check`,
                `- Staging is clean (all submissions reviewed)`,
                ``,
                `---`,
                `*Released by the RAPP Agent Registry*`,
              ].join('\n'),
              prerelease: meta.release_type === 'canary',
            });

            console.log(`Release created: ${tag}`);

      # Upload after the release exists. --clobber makes a re-run idempotent.
      # Clients fetch these by the STABLE alias
      #   github.com/<repo>/releases/latest/download/<asset>
      # which 302s to the newest release's copy, so no client pins a tag.
      - name: Upload agent assets to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.tag.outputs.tag }}" \
            dist/release-assets/* \
            --clobber --repo "${{ github.repository }}"
          echo "Uploaded $(ls dist/release-assets | wc -l) asset(s)."
